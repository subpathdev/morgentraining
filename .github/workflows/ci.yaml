# Tests every PR and push to main. Pushing a version tag (v0.1.0, v0.2.0, ...)
# also releases: the image ghcr.io/subpathdev/morgentraining:<version without v>
# is built and pushed, and a GitHub release is created. The smart-home repo
# deploys that image; Renovate opens the bump PR there.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the generated API code matches openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...

  # Builds without pushing, so a broken Dockerfile shows up in the PR.
  image:
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/subpathdev/morgentraining:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/subpathdev/morgentraining
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
