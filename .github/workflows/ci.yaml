# Tests every PR and push to main. Pushing a version tag (v0.1.0, v0.2.0, ...)
# also releases, all with the version without the v: the image
# ghcr.io/subpathdev/morgentraining:<version>, the Helm chart
# oci://ghcr.io/subpathdev/charts/morgentraining:<version> and a GitHub release.
# The smart-home repo deploys the chart; Renovate opens the bump PR there.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the generated API code matches openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: helm lint charts/morgentraining -f charts/morgentraining/ci-values.yaml
      - run: helm template test charts/morgentraining -f charts/morgentraining/ci-values.yaml

  # Builds without pushing, so a broken Dockerfile shows up in the PR.
  image:
    if: github.event_name == 'pull_request'
    needs: [test, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/subpathdev/morgentraining:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/subpathdev/morgentraining
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      # After the image, so a published chart never points to a missing image.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Publish the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/morgentraining --version "$VERSION" --app-version "$VERSION"
          helm push "morgentraining-$VERSION.tgz" oci://ghcr.io/subpathdev/charts
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
