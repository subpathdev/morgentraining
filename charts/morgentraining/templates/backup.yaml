{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "morgentraining.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- include "morgentraining.podSecurityContext" . | nindent 12 }}
          initContainers:
            # VACUUM INTO: a consistent copy while the page keeps running.
            - name: backup
              image: {{ include "morgentraining.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["backup", "-db", "/data/morgentraining.db", "/work/morgentraining.db"]
              securityContext:
                {{- include "morgentraining.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          containers:
            # Replaces last week's copy of the same weekday.
            - name: rotate
              image: "{{ .Values.backup.rotateImage.repository }}:{{ .Values.backup.rotateImage.tag }}"
              command:
                - /bin/sh
                - -c
                - mkdir -p /data/backups && mv /work/morgentraining.db "/data/backups/morgentraining-$(date +%a).db" && ls -l /data/backups
              securityContext:
                {{- include "morgentraining.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: work
                  mountPath: /work
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "morgentraining.claim" . }}
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
