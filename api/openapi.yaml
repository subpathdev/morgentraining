openapi: 3.0.3
info:
  title: Morgentraining API
  version: 1.2.0
  description: |
    API behind the Morgentraining page: people, their plan for today, finished rounds, and
    the plans themselves.

    There is no authentication. The service is meant for a home network behind a gateway
    that limits access (later an OIDC proxy that tells the service who is signed in).
    Anyone who can reach the API can add or change people and plans, just as they can record rounds.

    Plans are versioned. A saved plan version never changes, and every round points to the
    version it used. Plans and people are changed through this API or with the
    `morgentraining import` command; both follow the same rules.
servers:
  - url: /
tags:
  - name: people
  - name: rounds
  - name: plans
  - name: ops

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [ops]
      summary: Liveness check
      responses:
        "200":
          description: The service is up.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /api/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: People to choose from on the start page
      responses:
        "200":
          description: All people, in the order they were added.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/people/{key}:
    parameters:
      - $ref: "#/components/parameters/PersonKey"
    put:
      operationId: putPerson
      tags: [people]
      summary: Add a person, or change their name, language or plan
      description: |
        Works like importing a people file with this one person: an unknown key adds the
        person, a known key updates them. A changed plan applies from today (in the server's
        time zone); earlier days keep the plan they had. Nobody is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "200":
          description: The person existed and was updated (or was already like this).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "201":
          description: The person was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: All plans, each with its newest version
      responses:
        "200":
          description: Plans ordered by key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanSummary"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plans/{key}:
    parameters:
      - $ref: "#/components/parameters/PlanKey"
    get:
      operationId: getPlan
      tags: [plans]
      summary: The newest version of a plan, in the form it is edited in
      description: |
        `plan` has the same structure as a plan YAML file and as the body of `PUT`, with all
        languages. Its `exercises` are the library entries the plan uses, so a client can
        change the plan and send `plan` back.
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putPlan
      tags: [plans]
      summary: Create a plan or save a new version of it
      description: |
        Works like importing a plan file. Content that differs from the newest version is saved
        as a new version (saved versions never change, and rounds keep pointing to theirs);
        unchanged content saves nothing. The `exercises` are added to or update the exercise
        library shared by all plans; steps may also use exercises already in the library.
        An invalid plan is rejected with all its problems at once, and nothing is saved.
        People following the plan get the new version on their next load.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: The plan existed. `changed` says whether a new version was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSaved"
        "201":
          description: The plan was created as version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/people/{key}/today:
    parameters:
      - $ref: "#/components/parameters/PersonKey"
    get:
      operationId: getToday
      tags: [people]
      summary: The person's plan for a day, in their language, with their stats
      description: |
        Returns the newest version of the plan assigned to the person on that day.
        Texts are already in the person's language (falling back to German, then English).
      parameters:
        - name: date
          in: query
          required: false
          description: The person's local date. Defaults to today in the server's time zone (`MT_TZ`).
          schema:
            type: string
            format: date
            example: "2026-11-22"
      responses:
        "200":
          description: Plan and stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/people/{key}/rounds:
    parameters:
      - $ref: "#/components/parameters/PersonKey"
    post:
      operationId: addRound
      tags: [rounds]
      summary: Record a finished round
      description: |
        Several rounds on the same day are allowed; the streak counts days with at least
        one completed round.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundInput"
      responses:
        "200":
          description: Saved. Returns the person's stats as of the round's date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    PersonKey:
      name: key
      in: path
      required: true
      description: The person's key, e.g. `jan`.
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,64}$"
        example: jan

    PlanKey:
      name: key
      in: path
      required: true
      description: The plan's key, e.g. `morgen-5`.
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,64}$"
        example: morgen-5

  responses:
    BadRequest:
      description: The request is invalid (e.g. wrong date format or an unknown plan version).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown person, or the person has no plan on that day.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something went wrong on the server; details are in the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          example: "not found"

    Person:
      type: object
      required: [key, name, language]
      additionalProperties: false
      properties:
        key:
          type: string
          example: jan
        name:
          type: string
          example: Jan
        language:
          type: string
          description: Language code for texts, e.g. `de` or `en`.
          example: de

    Session:
      type: object
      description: Everything the page needs for one person's round.
      required: [person, plan, blocks, stats]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        plan:
          $ref: "#/components/schemas/SessionPlan"
        blocks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Block"
        stats:
          $ref: "#/components/schemas/Stats"

    SessionPlan:
      type: object
      required: [key, name, version, versionId, totalSeconds]
      additionalProperties: false
      properties:
        key:
          type: string
          example: morgen-5
        name:
          type: string
          example: 5 Minuten morgens
        version:
          type: integer
          minimum: 1
          description: Version number within this plan.
        versionId:
          type: integer
          format: int64
          description: Global ID of this plan version; send it back with the round.
        totalSeconds:
          type: integer
          description: Sum of all steps, without the optional rests the page adds between blocks.
          example: 300

    Block:
      type: object
      description: One item in the exercise list and one segment of the sun ring.
      required: [name, summary, seconds, steps]
      additionalProperties: false
      properties:
        name:
          type: string
          example: Wandsitzen
        summary:
          type: string
        seconds:
          type: integer
          example: 60
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Step"

    Step:
      type: object
      required: [kind, name, cue, seconds]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [exercise, rest, breath]
          description: "`rest` is a short break inside a block; `breath` shows breathe in / breathe out."
        name:
          type: string
          example: Wandsitzen 1 von 2
        cue:
          type: string
          description: Coaching text shown during the step; may be empty.
        seconds:
          type: integer
          minimum: 1
          example: 25

    Stats:
      type: object
      required: [streak, totalDays, doneToday]
      additionalProperties: false
      properties:
        streak:
          type: integer
          minimum: 0
          description: Days in a row with a completed round, counting back from today (or from yesterday if today has none yet).
        totalDays:
          type: integer
          minimum: 0
          description: Days with at least one completed round.
        doneToday:
          type: boolean

    PersonInput:
      type: object
      description: A person as sent to `PUT /api/people/{key}`; the key is in the path.
      required: [name, language, plan]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Mariana
        language:
          type: string
          pattern: "^[a-z]{2,3}$"
          description: Language code for texts, e.g. `de` or `en`. Texts fall back to German, then English.
          example: en
        plan:
          type: string
          pattern: "^[a-z0-9_-]{1,64}$"
          description: Key of an imported plan the person follows from today.
          example: morgen-5

    Text:
      type: object
      description: 'One text per language code, e.g. `{"de": "Aufwärmen", "en": "Warm-up"}`.'
      additionalProperties:
        type: string
      example: {de: Aufwärmen, en: Warm-up}

    PlanSummary:
      type: object
      required: [key, names, version, totalSeconds]
      additionalProperties: false
      properties:
        key:
          type: string
          example: morgen-5
        names:
          $ref: "#/components/schemas/Text"
        version:
          type: integer
          minimum: 1
          description: The newest version.
        totalSeconds:
          type: integer
          description: Sum of all steps of the newest version.
          example: 300

    PlanDetail:
      type: object
      required: [key, version, totalSeconds, plan]
      additionalProperties: false
      properties:
        key:
          type: string
          example: morgen-5
        version:
          type: integer
          minimum: 1
        totalSeconds:
          type: integer
          example: 300
        plan:
          $ref: "#/components/schemas/PlanInput"

    PlanInput:
      type: object
      description: A plan as its author writes it; the same structure as a plan YAML file. The key is in the path.
      required: [names, blocks]
      additionalProperties: false
      properties:
        names:
          $ref: "#/components/schemas/Text"
        createdBy:
          type: string
          description: Who made the plan. Only stored when the plan is created.
        exercises:
          type: array
          description: Exercises to add to or update in the shared library.
          items:
            $ref: "#/components/schemas/ExerciseInput"
        blocks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BlockInput"

    ExerciseInput:
      type: object
      required: [key, names]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z0-9_-]{1,64}$"
          example: wall-sit
        kind:
          type: string
          enum: [exercise, rest, breath]
          description: Defaults to `exercise`.
        names:
          $ref: "#/components/schemas/Text"
        cues:
          $ref: "#/components/schemas/Text"
        variants:
          type: object
          description: 'Named variants, e.g. `{"knees": {"de": "auf den Knien"}}`.'
          additionalProperties:
            $ref: "#/components/schemas/Text"

    BlockInput:
      type: object
      description: One item in the exercise list and one segment of the sun ring.
      required: [names, steps]
      additionalProperties: false
      properties:
        names:
          $ref: "#/components/schemas/Text"
        summary:
          $ref: "#/components/schemas/Text"
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StepInput"

    StepInput:
      type: object
      required: [exercise, seconds]
      additionalProperties: false
      properties:
        exercise:
          type: string
          pattern: "^[a-z0-9_-]{1,64}$"
          description: Key of an exercise in this plan's `exercises` or already in the library.
        seconds:
          type: integer
          minimum: 1
          maximum: 3600
        variant:
          type: string
          description: Key of one of the exercise's variants.
        names:
          $ref: "#/components/schemas/Text"
        cues:
          $ref: "#/components/schemas/Text"

    PlanSaved:
      type: object
      required: [key, version, changed]
      additionalProperties: false
      properties:
        key:
          type: string
          example: morgen-5
        version:
          type: integer
          minimum: 1
          description: The plan's newest version after saving.
        changed:
          type: boolean
          description: False if the content was the same as the newest version, so nothing was saved.

    RoundInput:
      type: object
      required: [planVersionId, date, completed]
      additionalProperties: false
      properties:
        planVersionId:
          type: integer
          format: int64
          description: "`plan.versionId` from the session the round was done with."
        date:
          type: string
          format: date
          description: The person's local date.
          example: "2026-11-22"
        startedAt:
          type: string
          format: date-time
          description: When the round was started.
        completed:
          type: boolean
          description: True if the round ran to the end (steps may have been skipped).
        skippedSteps:
          type: array
          description: Positions of skipped steps, counted across all blocks from 0.
          items:
            type: integer
            minimum: 0
